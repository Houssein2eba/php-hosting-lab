services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hosting-lab-web
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend

  time-app:
    build:
      context: .
      dockerfile: docker/time-app/Dockerfile
    container_name: hosting-lab-time
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    networks:
      - frontend

  database:
    image: mariadb:11
    container_name: hosting-lab-database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  frontend:
  backend:
    internal: true

volumes:
  database_data:
